name: Build and Deploy Emilia

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repo
        uses: actions/checkout@v6.0.2

      - name: Python Setup
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13' 

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
      
      - name: Download UPX
        shell: pwsh
        run: |
          $output = "upx.zip"
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v5.1.0/upx-5.1.0-win64.zip" -OutFile $output
          Expand-Archive -Path $output -DestinationPath upx_temp
          Move-Item -Path upx_temp/upx-5.1.0-win64/upx.exe -Destination .
      
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $LK_PATH = python -c "import livekit; print(list(livekit.__path__)[0])"
          pyinstaller --noconfirm --onedir --windowed `
            --icon "src\icon.ico" `
            --uac-admin `
            --add-data "$LK_PATH\rtc\resources\livekit_ffi.dll;livekit/rtc/resources" `
            --hidden-import "urllib3.contrib.resolver.system" `
            --hidden-import "urllib3.contrib.hface.protocols.http1" `
            --hidden-import "urllib3.contrib.hface.protocols.http2" `
            --hidden-import "livekit.rtc.resources" `
            "src\main.py"
          copy "src\icon.ico" "dist\main\icon.ico"
          xcopy /E /I /H /Y "src\lang" "dist\main\lang"
          if (Test-Path "dist\main\main.exe") {
              Rename-Item -Path "dist\main\main.exe" -NewName "emilia.exe"
          } else {
              exit 1
          }
      - name: Cleanup Junk Files
        run: |
          python clean_dist.py
          
      - name: Create manifest
        shell: pwsh
        run: |
          python create_manifest.py
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-build
          path: dist/main/
          retention-days: 1

      - name: Build Setup file
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: Emilia_Installer
          path: EmiliaSetup.exe

      - name: Public release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: EmiliaSetup.exe

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: deploy_files

      - name: Execute Remote Commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /var/www/emilia
            rm -rf /var/www/emilia/*

      - name: Copy Files via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy_files/*"
          target: "/var/www/emilia"
          strip_components: 1
