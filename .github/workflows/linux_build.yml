name: Build and Deploy Emilia (Linux)

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repo
        uses: actions/checkout@v6.0.2

      - name: Resolve tag
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
              echo "TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          else
              echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          fi

      - name: Python Setup
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Install PortAudio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-dev gcc

      - name: Install Live2D
        run: |
          wget https://github.com/EasyLive2D/live2d-py/releases/download/v0.7.0.4/live2d_py-0.7.0.4-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
          pip install live2d_py-0.7.0.4-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.19.0
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download UPX
        run: |
          wget https://github.com/upx/upx/releases/download/v5.1.0/upx-5.1.0-amd64_linux.tar.xz
          tar -xf upx-5.1.0-amd64_linux.tar.xz
          mv upx-5.1.0-amd64_linux/upx .

      - name: Build with PyInstaller
        run: |
          chmod -R +rx $(python -c "import PyQt6; print(list(PyQt6.__path__)[0])")   
          
          pyinstaller --noconfirm --onedir --windowed \
            --icon "src/icon.ico" \
            --collect-all "livekit" \
            --collect-all "live2d" \
            --collect-all "OpenGL" \
            --hidden-import "urllib3.contrib.resolver.system" \
            --hidden-import "urllib3.contrib.hface.protocols.http1" \
            --hidden-import "urllib3.contrib.hface.protocols.http2" \
            --hidden-import "livekit.rtc.resources" \
            "src/main.py"
          
          cp "src/icon.ico" "dist/main/icon.ico"
          cp -r "src/lang" "dist/main/lang"
          cp -r "src/themes" "dist/main/themes"
          mkdir -p "dist/main/data"
          cp -r "src/data/default_qss" "dist/main/data/default_qss"
          
          if [ -f "dist/main/main" ]; then
              mv "dist/main/main" "dist/main/emilia"
          else
              exit 1
          fi

      - name: Cleanup Junk Files
        run: |
          python clean_dist.py

      - name: Create manifest
        run: |
          python create_manifest.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-build
          path: dist/main/
          retention-days: 1

      - name: Create Tarball Archive
        run: |
          tar -czf emilia-linux.tar.gz -C dist main

      - name: Upload Linux Archive Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Emilia_Linux_Archive
          path: emilia-linux.tar.gz

      - name: Public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: emilia-linux.tar.gz

  deploy_server1:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: deploy_files

      - name: Deploy to Server 1
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy_files/*"
          target: "/var/www/emilialinux"
          strip_components: 1

  deploy_server2:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: deploy_files

      - name: Deploy to Server 2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS2_HOST }}
          username: ${{ secrets.VPS2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy_files/*"
          target: "/var/www/emilialinux"
          strip_components: 1